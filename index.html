<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghép Hình Nghệ Thuật - Jigsaw Puzzle</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Quicksand & Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* Tùy chỉnh font chữ và ngăn chặn hành vi kéo/zoom mặc định trên thiết bị cảm ứng */
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: radial-gradient(circle at center, #fdf8f2 0%, #f3e8d8 100%);
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        h1, h2, .font-display {
            font-family: 'Quicksand', sans-serif;
        }
        /* Hiệu ứng bóng đổ mềm cho giao diện gỗ ấm áp */
        .wood-panel {
            background: rgba(255, 252, 247, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(217, 195, 169, 0.6);
            box-shadow: 0 8px 32px rgba(92, 64, 38, 0.08);
        }
        .btn-primary {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(217, 119, 6, 0.4);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: #fff;
            color: #5c4026;
            border: 1px solid #e2d1bc;
            box-shadow: 0 2px 6px rgba(92, 64, 38, 0.05);
            transition: all 0.15s ease;
        }
        .btn-secondary:hover {
            background: #fcf6ee;
            border-color: #d4b895;
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }
        .btn-active {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #b45309;
        }
        /* Canvas chính chiếm toàn bộ vùng chơi */
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #game-canvas:active {
            cursor: grabbing;
        }
        /* Thanh cuộn tùy chỉnh cho modal chọn ảnh */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f5ebe0;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d5bdaf;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b09382;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col text-stone-800">

    <script>
    /**
     * TRÒ CHƠI GHÉP HÌNH NGHỆ THUẬT (JIGSAW PUZZLE)
     * Kiến trúc:
     * 1. SoundManager: Tạo hiệu ứng âm thanh bằng Web Audio API (không cần file mp3 bên ngoài).
     * 2. ArtGenerator: Vẽ 4 bức tranh mẫu sắc nét 800x800 bằng HTML5 Canvas 2D (Phong cảnh, Kiến trúc, Động vật, Trừu tượng).
     * 3. PuzzleEngine:
     *    - Sinh ma trận khớp răng cưa (tabs & blanks) ngẫu nhiên nhưng khớp nhau tuyệt đối giữa các cạnh liền kề.
     *    - Pre-render từng mảnh ghép vào Offscreen Canvas riêng kèm viền nổi 3D và đổ bóng để đạt 60FPS mượt mà.
     *    - Quản lý nhóm mảnh ghép (Group ID): Khi 2 mảnh liền kề khớp nhau ở bất kỳ đâu trên bàn, chúng hợp nhất thành 1 khối.
     *    - Hỗ trợ lực hút từ tính (Magnetic Snap) vào vị trí chuẩn trên bảng hoặc vào mảnh liền kề.
     *    - Hệ thống Confetti chúc mừng khi hoàn thành.
     */

    // =========================================================================
    // 1. QUẢN LÝ ÂM THANH (WEB AUDIO API)
    // =========================================================================
    class SoundManager {
        constructor() {
            this.enabled = true;
            this.ctx = null;
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        // Âm thanh nhấc mảnh ghép lên
        playPickup() {
            if (!this.enabled) return;
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(480, this.ctx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.06);
        }

        // Âm thanh "tách" êm ái khi khớp mảnh ghép
        playSnap() {
            if (!this.enabled) return;
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.14);
        }

        // Giai điệu chiến thắng
        playWin() {
            if (!this.enabled) return;
            this.init();
            if (!this.ctx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                const now = this.ctx.currentTime + idx * 0.11;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.16, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            });
        }
    }

    // =========================================================================
    // 2. BỘ SƯU TẬP TRANH MẪU PROCEDURAL ART (800x800 CANVAS)
    // =========================================================================
    class ArtGenerator {
        static getPresets() {
            return [
                {
                    id: 'sunset-mountain',
                    title: 'Hoàng Hôn Núi Phú Sĩ',
                    category: 'Phong cảnh',
                    draw: (ctx, w, h) => {
                        // Bầu trời hoàng hôn chuyển sắc
                        const sky = ctx.createLinearGradient(0, 0, 0, h * 0.68);
                        sky.addColorStop(0, '#1e1b4b');
                        sky.addColorStop(0.35, '#831843');
                        sky.addColorStop(0.7, '#ea580c');
                        sky.addColorStop(1, '#fde047');
                        ctx.fillStyle = sky;
                        ctx.fillRect(0, 0, w, h);

                        // Mặt trời rực rỡ
                        const sun = ctx.createRadialGradient(w * 0.5, h * 0.48, 10, w * 0.5, h * 0.48, w * 0.22);
                        sun.addColorStop(0, '#ffffff');

                        ctx.fillRect(0, 0, w, h);

                        const palette = ['#f43f5e', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6', '#ec4899', '#eab308'];
                        const cell = 100;

                        for (let row = 0; row < 8; row++) {
                            for (let col = 0; col < 8; col++) {
                                const x = col * cell;
                                const y = row * cell;
                                const c1 = palette[(row * 3 + col * 2) % palette.length];
                                const c2 = palette[(row + col * 3 + 1) % palette.length];
                                const pattern = (row + col) % 4;

                                ctx.fillStyle = c1;
                                ctx.fillRect(x, y, cell, cell);

                                ctx.fillStyle = c2;
                                ctx.beginPath();
                                if (pattern === 0) {
                                    ctx.arc(x + cell / 2, y + cell / 2, cell * 0.38, 0, Math.PI * 2);
                                } else if (pattern === 1) {
                                    ctx.moveTo(x, y);
                                    ctx.lineTo(x + cell, y);
                                    ctx.lineTo(x, y + cell);
                                } else if (pattern === 2) {
                                    ctx.arc(x, y, cell * 0.85, 0, Math.PI / 2);
                                    ctx.lineTo(x, y);
                                } else {
                                    ctx.moveTo(x + cell / 2, y + 10);
                                    ctx.lineTo(x + cell - 10, y + cell / 2);
                                    ctx.lineTo(x + cell / 2, y + cell - 10);
                                    ctx.lineTo(x + 10, y + cell / 2);
                                }
                                ctx.closePath();
                                ctx.fill();
                            }
                        }

                        // Vòng tròn tâm điểm nghệ thuật
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 8;
                        ctx.beginPath();
                        ctx.arc(w / 2, h / 2, 180, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
            ];

        // Tạo ảnh DataURL hoặc Offscreen Canvas từ preset
        static createArtCanvas(preset, size = 800) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            preset.draw(ctx, size, size);
            return canvas;
        }
    }

    // =========================================================================
    // 3. ENGINE GHÉP HÌNH JIGSAW CHUYÊN NGHIỆP
    // =========================================================================
    class JigsawGame {
        constructor() {
            this.canvas = document.getElementById('game-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.sound = new SoundManager();

            // Trạng thái thiết lập
            this.presets = ArtGenerator.getPresets();
            this.selectedPresetIndex = 0;
            this.customImage = null; // Lưu ảnh người dùng tải lên
            this.gridSize = 4; // Mặc định 4x4

            // Trạng thái ván chơi
            this.sourceCanvas = null; // Ảnh gốc đã chuẩn hóa vuông 800x800
            this.pieces = [];
            this.boardRect = { x: 0, y: 0, size: 400 };
            this.pieceSize = 100;
            this.tabSize = 22;

            // Tương tác kéo thả
            this.draggingGroup = null;
            this.dragOffset = { x: 0, y: 0 };
            this.lastPointer = { x: 0, y: 0 };

            // Hỗ trợ & Thống kê
            this.showGhostHint = false;
            this.moves = 0;
            this.seconds = 0;
            this.timerInterval = null;
            this.isWon = false;
            this.confetti = [];
            this.snapAnimations = []; // Hiệu ứng lóe sáng khi khớp mảnh

            this.initUI();
            this.resizeCanvas();
            window.addEventListener('resize', () => this.handleResize());
            this.bindPointerEvents();

            // Vòng lặp render 60FPS
            requestAnimationFrame(() => this.loop());
        }

        // Khởi tạo giao diện chọn hình & sự kiện nút bấm
        initUI() {
            const gallery = document.getElementById('gallery-grid');
            gallery.innerHTML = '';

            this.presets.forEach((preset, idx) => {
                const thumbCanvas = ArtGenerator.createArtCanvas(preset, 240);
                const card = document.createElement('div');
                card.className = `preset-card cursor-pointer rounded-2xl overflow-hidden border-2 transition-all bg-white shadow-sm ${idx === 0 ? 'border-amber-500 ring-2 ring-amber-400/50' : 'border-transparent hover:border-amber-300'}`;
                card.dataset.index = idx;

                card.innerHTML = `
                    <div class="aspect-square w-full overflow-hidden bg-stone-100">
                        <img src="${thumbCanvas.toDataURL()}" alt="${preset.title}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-2.5">
                        <div class="text-[10px] font-bold uppercase tracking-wider text-amber-600">${preset.category}</div>
                        <div class="font-display font-bold text-xs sm:text-sm text-stone-800 truncate">${preset.title}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    this.customImage = null;
                    this.selectedPresetIndex = idx;
                    document.querySelectorAll('.preset-card').forEach(c => {
                        c.classList.remove('border-amber-500', 'ring-2', 'ring-amber-400/50');
                        c.classList.add('border-transparent');
                    });
                    card.classList.remove('border-transparent');
                    card.classList.add('border-amber-500', 'ring-2', 'ring-amber-400/50');
                });

                gallery.appendChild(card);
            });

            // Xử lý tải ảnh cá nhân từ máy
            document.getElementById('image-upload').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        this.customImage = img;
                        // Bỏ chọn các preset
                        document.querySelectorAll('.preset-card').forEach(c => {
                            c.classList.remove('border-amber-500', 'ring-2', 'ring-amber-400/50');
                            c.classList.add('border-transparent');
                        });
                        this.showToast('Đã tải ảnh của bạn! Nhấn "Bắt Đầu Ghép Hình" để chơi.');
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            // Chọn độ khó
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    this.gridSize = parseInt(btn.dataset.grid, 10);
                    document.querySelectorAll('.diff-btn').forEach(b => {
                        b.classList.remove('border-amber-500', 'bg-amber-50/90');
                    });
                    btn.classList.add('border-amber-500', 'bg-amber-50/90');
                });
            });

            // Nút Bắt đầu game
            document.getElementById('btn-start-game').addEventListener('click', () => {
                document.getElementById('setup-modal').classList.add('hidden');
                this.startNewGame();
            });

            // Mở / Đóng Modal
            document.getElementById('btn-open-menu').addEventListener('click', () => {
                document.getElementById('setup-modal').classList.remove('hidden');
            });
            document.getElementById('btn-close-modal').addEventListener('click', () => {
                // Nếu chưa có game nào chạy thì tự tạo game mặc định
                if (!this.sourceCanvas) this.startNewGame();
                document.getElementById('setup-modal').classList.add('hidden');
            });

            // Bật / Tắt hình mờ gợi ý
            const btnHint = document.getElementById('btn-toggle-hint');
            btnHint.addEventListener('click', () => {
                this.showGhostHint = !this.showGhostHint;
                btnHint.classList.toggle('btn-active', this.showGhostHint);
                this.showToast(this.showGhostHint ? 'Đã bật hình nền gợi ý' : 'Đã tắt hình nền gợi ý');
            });

            // Xếp gọn mảnh lẻ sang hai bên
            document.getElementById('btn-scatter').addEventListener('click', () => {
                this.scatterLoosePieces();
                this.showToast('Đã xếp gọn các mảnh chưa ghép');
            });

            // Bật / Tắt âm thanh
            document.getElementById('btn-sound').addEventListener('click', () => {
                this.sound.enabled = !this.sound.enabled;
                document.getElementById('icon-sound-on').classList.toggle('hidden', !this.sound.enabled);
                document.getElementById('icon-sound-off').classList.toggle('hidden', this.sound.enabled);
                this.showToast(this.sound.enabled ? 'Đã bật âm thanh' : 'Đã tắt âm thanh');
            });

            // Nút trên Modal Chiến Thắng
            document.getElementById('btn-play-again').addEventListener('click', () => {
                document.getElementById('victory-modal').classList.add('hidden');
                document.getElementById('victory-modal').classList.remove('flex');
                this.startNewGame();
            });
            document.getElementById('btn-choose-another').addEventListener('click', () => {
                document.getElementById('victory-modal').classList.add('hidden');
                document.getElementById('victory-modal').classList.remove('flex');
                document.getElementById('setup-modal').classList.remove('hidden');
            });
        }

        showToast(msg) {
            const toast = document.getElementById('toast-msg');
            toast.textContent = msg;
            toast.style.opacity = '1';
            clearTimeout(this.toastTimer);
            this.toastTimer = setTimeout(() => {
                toast.style.opacity = '0';
            }, 2200);
        }

        // Tính toán kích thước bàn ghép phù hợp với mọi màn hình (Responsive)
        calculateLayout() {
            const w = this.canvas.width;
            const h = this.canvas.height;
            const isMobile = w < 640;

            // Dành không gian xung quanh bảng để chứa các mảnh ghép
            const maxBoardW = isMobile ? w * 0.78 : Math.min(w * 0.52, h * 0.72);
            const maxBoardH = isMobile ? h * 0.56 : h * 0.74;
            const size = Math.floor(Math.min(maxBoardW, maxBoardH));

            this.boardRect = {
                x: Math.floor((w - size) / 2),
                y: Math.floor((h - size) / 2) - (isMobile ? 25 : 0),
                size: size
            };
            this.pieceSize = size / this.gridSize;
            this.tabSize = this.pieceSize * 0.22;
        }

        resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            this.canvas.width = wrapper.clientWidth;
            this.canvas.height = wrapper.clientHeight;
            this.calculateLayout();
        }

        handleResize() {
            const oldBoard = { ...this.boardRect };
            this.resizeCanvas();
            if (!this.sourceCanvas || this.pieces.length === 0) return;

            // Tỷ lệ co giãn khi xoay màn hình hoặc thay đổi kích thước cửa sổ
            const scale = this.boardRect.size / oldBoard.size;
            this.pieces.forEach(p => {
                if (p.locked) {
                    p.x = this.boardRect.x + p.col * this.pieceSize;
                    p.y = this.boardRect.y + p.row * this.pieceSize;
                } else {
                    const relX = (p.x - oldBoard.x) * scale;
                    const relY = (p.y - oldBoard.y) * scale;
                    p.x = Math.max(10, Math.min(this.canvas.width - this.pieceSize - 10, this.boardRect.x + relX));
                    p.y = Math.max(10, Math.min(this.canvas.height - this.pieceSize - 10, this.boardRect.y + relY));
                }
            });
            this.prerenderAllPieces();
        }

        // Bắt đầu màn chơi mới
        startNewGame() {
            this.sound.init();
            this.isWon = false;
            this.moves = 0;
            this.seconds = 0;
            this.confetti = [];
            this.snapAnimations = [];
            this.updateStatsUI();

            // Cập nhật tiêu đề phụ
            const diffNames = { 3: 'Dễ', 4: 'Trung bình', 5: 'Khó', 6: 'Siêu khó' };
            document.getElementById('status-subtitle').textContent =
                `Chế độ: ${diffNames[this.gridSize]} (${this.gridSize}×${this.gridSize} - ${this.gridSize ** 2} mảnh)`;

            // Chuẩn hóa ảnh nguồn về hình vuông 800x800 (crop center nếu ảnh upload hình chữ nhật)
            const targetRes = 800;
            const offCanvas = document.createElement('canvas');
            offCanvas.width = targetRes;
            offCanvas.height = targetRes;
            const oCtx = offCanvas.getContext('2d');

            if (this.customImage) {
                const img = this.customImage;
                const minSide = Math.min(img.width, img.height);
                const sx = (img.width - minSide) / 2;
                const sy = (img.height - minSide) / 2;
                oCtx.drawImage(img, sx, sy, minSide, minSide, 0, 0, targetRes, targetRes);
            } else {
                const preset = this.presets[this.selectedPresetIndex];
                preset.draw(oCtx, targetRes, targetRes);
            }
            this.sourceCanvas = offCanvas;

            this.calculateLayout();
            this.generatePieces();
            this.prerenderAllPieces();
            this.scatterLoosePieces();
            this.startTimer();
        }

        // Sinh dữ liệu các mảnh ghép với hình dạng răng cưa khớp tuyệt đối
        generatePieces() {
            this.pieces = [];
            const N = this.gridSize;

            // Ma trận cạnh ngang (horizontal edges) và cạnh dọc (vertical edges)
            // Giá trị: 0 = cạnh phẳng (viền ngoài), 1 = lồi ra (tab), -1 = lõm vào (blank)
            const hEdges = Array.from({ length: N + 1 }, () => Array(N).fill(0));
            const vEdges = Array.from({ length: N }, () => Array(N + 1).fill(0));

            for (let r = 1; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    hEdges[r][c] = Math.random() > 0.5 ? 1 : -1;
                }
            }
            for (let r = 0; r < N; r++) {
                for (let c = 1; c < N; c++) {
                    vEdges[r][c] = Math.random() > 0.5 ? 1 : -1;
                }
            }

            let idCounter = 0;
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    // Quy ước hướng lồi/lõm so với tâm mảnh ghép: +1 là lồi ra ngoài, -1 là lõm vào trong
                    const top = r === 0 ? 0 : -hEdges[r][c];
                    const bottom = r === N - 1 ? 0 : hEdges[r + 1][c];
                    const left = c === 0 ? 0 : -vEdges[r][c];
                    const right = c === N - 1 ? 0 : vEdges[r][c + 1];

                    this.pieces.push({
                        id: idCounter,
                        groupId: idCounter, // Ban đầu mỗi mảnh thuộc 1 nhóm riêng
                        row: r,
                        col: c,
                        edges: { top, right, bottom, left },
                        x: 0,
                        y: 0,
                        locked: false,
                        cacheCanvas: null,
                        pad: 0
                    });
                    idCounter++;
                }
            }
        }

        // Vẽ đường dẫn (Path) răng cưa Jigsaw bằng đường cong Bezier chuẩn xác
        tracePiecePath(ctx, size, edges, offsetX = 0, offsetY = 0) {
            const t = size * 0.22; // Độ nhô của khớp nối
            ctx.beginPath();
            ctx.moveTo(offsetX, offsetY);

            // 1. Cạnh TRÊN (từ trái sang phải)
            if (edges.top === 0) {
                ctx.lineTo(offsetX + size, offsetY);
            } else {
                const dir = -edges.top; // -1 hướng lên trên (lồi), +1 hướng xuống dưới (lõm)
                ctx.lineTo(offsetX + size * 0.35, offsetY);
                ctx.bezierCurveTo(
                    offsetX + size * 0.35, offsetY + dir * t * 0.3,
                    offsetX + size * 0.28, offsetY + dir * t,
                    offsetX + size * 0.50, offsetY + dir * t
                );
                ctx.bezierCurveTo(
                    offsetX + size * 0.72, offsetY + dir * t,
                    offsetX + size * 0.65, offsetY + dir * t * 0.3,
                    offsetX + size * 0.65, offsetY
                );
                ctx.lineTo(offsetX + size, offsetY);
            }

            // 2. Cạnh PHẢI (từ trên xuống dưới)
            if (edges.right === 0) {
                ctx.lineTo(offsetX + size, offsetY + size);
            } else {
                const dir = edges.right; // +1 hướng sang phải (lồi)
                ctx.lineTo(offsetX + size, offsetY + size * 0.35);
                ctx.bezierCurveTo(
                    offsetX + size + dir * t * 0.3, offsetY + size * 0.35,
                    offsetX + size + dir * t, offsetY + size * 0.28,
                    offsetX + size + dir * t, offsetY + size * 0.50
                );
                ctx.bezierCurveTo(
                    offsetX + size + dir * t, offsetY + size * 0.72,
                    offsetX + size + dir * t * 0.3, offsetY + size * 0.65,
                    offsetX + size, offsetY + size * 0.65
                );
                ctx.lineTo(offsetX + size, offsetY + size);
            }

            // 3. Cạnh DƯỚI (từ phải sang trái)
            if (edges.bottom === 0) {
                ctx.lineTo(offsetX, offsetY + size);
            } else {
                const dir = edges.bottom; // +1 hướng xuống dưới (lồi)
                ctx.lineTo(offsetX + size * 0.65, offsetY + size);
                ctx.bezierCurveTo(
                    offsetX + size * 0.65, offsetY + size + dir * t * 0.3,
                    offsetX + size * 0.72, offsetY + size + dir * t,
                    offsetX + size * 0.50, offsetY + size + dir * t
                );
                ctx.bezierCurveTo(
                    offsetX + size * 0.28, offsetY + size + dir * t,
                    offsetX + size * 0.35, offsetY + size + dir * t * 0.3,
                    offsetX + size * 0.35, offsetY + size
                );
                ctx.lineTo(offsetX, offsetY + size);
            }

            // 4. Cạnh TRÁI (từ dưới lên trên)
            if (edges.left === 0) {
                ctx.lineTo(offsetX, offsetY);
            } else {
                const dir = -edges.left; // -1 hướng sang trái (lồi)
                ctx.lineTo(offsetX, offsetY + size * 0.65);
                ctx.bezierCurveTo(
                    offsetX + dir * t * 0.3, offsetY + size * 0.65,
                    offsetX + dir * t, offsetY + size * 0.72,
                    offsetX + dir * t, offsetY + size * 0.50
                );
                ctx.bezierCurveTo(
                    offsetX + dir * t, offsetY + size * 0.28,
                    offsetX + dir * t * 0.3, offsetY + size * 0.35,
                    offsetX, offsetY + size * 0.35
                );
                ctx.lineTo(offsetX, offsetY);
            }

            ctx.closePath();
        }

        // Pre-render từng mảnh ghép vào Offscreen Canvas để tối ưu tốc độ khung hình
        prerenderAllPieces() {
            const pSize = this.pieceSize;
            const pad = Math.ceil(pSize * 0.32); // Phần đệm chứa khớp lồi
            const srcStep = this.sourceCanvas.width / this.gridSize;
            const srcRatio = srcStep / pSize;

            this.pieces.forEach(p => {
                const c = document.createElement('canvas');
                c.width = Math.ceil(pSize + pad * 2);
                c.height = Math.ceil(pSize + pad * 2);
                const ctx = c.getContext('2d');

                ctx.save();
                this.tracePiecePath(ctx, pSize, p.edges, pad, pad);
                ctx.clip();

                // Vẽ phần hình ảnh tương ứng (bao gồm cả phần lấn sang ô bên cạnh cho khớp lồi)
                const sx = (p.col * pSize - pad) * srcRatio;
                const sy = (p.row * pSize - pad) * srcRatio;
                const sw = (pSize + pad * 2) * srcRatio;
                const sh = (pSize + pad * 2) * srcRatio;

                ctx.drawImage(this.sourceCanvas, sx, sy, sw, sh, 0, 0, pSize + pad * 2, pSize + pad * 2);

                // Hiệu ứng viền sáng nổi 3D nhẹ cho cạnh mảnh ghép
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.restore();

                // Viền tối sắc nét bên ngoài
                ctx.save();
                this.tracePiecePath(ctx, pSize, p.edges, pad, pad);
                ctx.strokeStyle = 'rgba(30, 20, 10, 0.45)';
                ctx.lineWidth = 1.2;
                ctx.stroke();
                ctx.restore();

                p.cacheCanvas = c;
                p.pad = pad;
            });
        }

        // Xếp gọn các mảnh chưa khóa vào vùng trống xung quanh bảng ghép
        scatterLoosePieces() {
            const w = this.canvas.width;
            const h = this.canvas.height;
            const b = this.boardRect;
            const pSize = this.pieceSize;
            const isMobile = w < 640;

            // Gom theo từng groupId chưa locked để không tách rời các mảnh đã nối với nhau
            const groupsMap = new Map();
            this.pieces.forEach(p => {
                if (!p.locked) {
                    if (!groupsMap.has(p.groupId)) groupsMap.set(p.groupId, []);
                    groupsMap.get(p.groupId).push(p);
                }
            });

            const groups = Array.from(groupsMap.values());
            // Xáo trộn ngẫu nhiên thứ tự
            for (let i = groups.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [groups[i], groups[j]] = [groups[j], groups[i]];
            }

            groups.forEach((grp, idx) => {
                // Tính bounding box của nhóm hiện tại
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                grp.forEach(p => {
                    minX = Math.min(minX, p.x);
                    minY = Math.min(minY, p.y);
                    maxX = Math.max(maxX, p.x + pSize);
                    maxY = Math.max(maxY, p.y + pSize);
                });
                const grpW = maxX - minX;
                const grpH = maxY - minY;

                let targetX, targetY;
                if (isMobile) {
                    // Trên mobile: rải ở vùng phía dưới và phía trên bảng
                    const zone = idx % 2;
                    targetX = 12 + Math.random() * Math.max(10, w - grpW - 24);
                    if (zone === 0 && b.y > grpH + 15) {
                        targetY = 8 + Math.random() * Math.max(5, b.y - grpH - 12);
                    } else {
                        const bottomStart = b.y + b.size + 10;
                        const availH = Math.max(10, h - bottomStart - grpH - 10);
                        targetY = bottomStart + Math.random() * availH;
                    }
                } else {
                    // Trên desktop/tablet: chia đều hai bên trái và phải của bảng
                    const isLeft = idx % 2 === 0;
                    if (isLeft && b.x > grpW + 20) {
                        targetX = 16 + Math.random() * Math.max(10, b.x - grpW - 32);
                    } else {
                        const rightStart = b.x + b.size + 16;
                        const availW = Math.max(10, w - rightStart - grpW - 16);
                        targetX = rightStart + Math.random() * availW;
                    }
                    targetY = 16 + Math.random() * Math.max(10, h - grpH - 32);
                }

                // Đảm bảo không vượt ra khỏi màn hình
                targetX = Math.max(8, Math.min(w - grpW - 8, targetX));
                targetY = Math.max(8, Math.min(h - grpH - 8, targetY));

                const dx = targetX - minX;
                const dy = targetY - minY;
                grp.forEach(p => {
                    p.x += dx;
                    p.y += dy;
                });
            });
        }

        // Bộ đếm thời gian
        startTimer() {
            clearInterval(this.timerInterval);
            this.timerInterval = setInterval(() => {
                if (!this.isWon) {
                    this.seconds++;
                    this.updateStatsUI();
                }
            }, 1000);
        }

        formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        updateStatsUI() {
            document.getElementById('timer-display').textContent = this.formatTime(this.seconds);
            document.getElementById('moves-display').textContent = this.moves;
            const lockedCount = this.pieces.filter(p => p.locked).length;
            const total = this.pieces.length || 1;
            const pct = Math.round((lockedCount / total) * 100);
            document.getElementById('progress-display').textContent = `${pct}%`;
        }

        // Xử lý sự kiện chuột và cảm ứng thống nhất qua Pointer Events
        bindPointerEvents() {
            const getPos = (e) => {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            };

            this.canvas.addEventListener('pointerdown', (e) => {
                if (this.isWon || !this.sourceCanvas) return;
                this.canvas.setPointerCapture(e.pointerId);
                const pos = getPos(e);
                this.lastPointer = pos;

                // Duyệt ngược từ trên xuống dưới để chọn mảnh nằm trên cùng
                for (let i = this.pieces.length - 1; i >= 0; i--) {
                    const p = this.pieces[i];
                    if (p.locked) continue;

                    // Kiểm tra điểm chạm có nằm trong vùng mảnh ghép không
                    if (
                        pos.x >= p.x - this.tabSize * 0.5 &&
                        pos.x <= p.x + this.pieceSize + this.tabSize * 0.5 &&
                        pos.y >= p.y - this.tabSize * 0.5 &&
                        pos.y <= p.y + this.pieceSize + this.tabSize * 0.5
                    ) {
                        this.draggingGroup = p.groupId;
                        this.sound.playPickup();

                        // Đưa toàn bộ các mảnh trong nhóm đang kéo lên lớp trên cùng (z-index cao nhất)
                        const groupPieces = this.pieces.filter(item => item.groupId === this.draggingGroup);
                        const otherPieces = this.pieces.filter(item => item.groupId !== this.draggingGroup);
                        this.pieces = [...otherPieces, ...groupPieces];
                        break;
                    }
                }
            });

            this.canvas.addEventListener('pointermove', (e) => {
                if (this.draggingGroup === null) return;
                const pos = getPos(e);
                const dx = pos.x - this.lastPointer.x;
                const dy = pos.y - this.lastPointer.y;
                this.lastPointer = pos;

                // Di chuyển toàn bộ nhóm mảnh ghép
                this.pieces.forEach(p => {
                    if (p.groupId === this.draggingGroup) {
                        p.x += dx;
                        p.y += dy;
                    }
                });
            });

            const endDrag = (e) => {
                if (this.draggingGroup === null) return;
                if (e.pointerId) {
                    try { this.canvas.releasePointerCapture(e.pointerId); } catch (_) {}
                }

                this.moves++;
                this.checkSnapAndMerge(this.draggingGroup);
                this.draggingGroup = null;
                this.updateStatsUI();
                this.checkVictory();
            };

            this.canvas.addEventListener('pointerup', endDrag);
            this.canvas.addEventListener('pointercancel', endDrag);
        }

        // Kiểm tra hút từ tính vào bảng hoặc gộp nhóm với mảnh liền kề
        checkSnapAndMerge(groupId) {
            const snapDist = Math.max(18, this.pieceSize * 0.26);
            const groupPieces = this.pieces.filter(p => p.groupId === groupId);
            let snapped = false;

            // 1. Kiểm tra khớp vào đúng tọa độ trên Bảng Khung (Board)
            for (const p of groupPieces) {
                const targetX = this.boardRect.x + p.col * this.pieceSize;
                const targetY = this.boardRect.y + p.row * this.pieceSize;
                const dist = Math.hypot(p.x - targetX, p.y - targetY);

                if (dist < snapDist) {
                    const dx = targetX - p.x;
                    const dy = targetY - p.y;
                    groupPieces.forEach(gp => {
                        gp.x += dx;
                        gp.y += dy;
                        gp.locked = true;
                        this.addSnapEffect(gp.x + this.pieceSize / 2, gp.y + this.pieceSize / 2);
                    });

                    // Đưa các mảnh đã khóa xuống lớp dưới cùng để không che mảnh chưa ghép
                    const locked = this.pieces.filter(item => item.locked);
                    const unlocked = this.pieces.filter(item => !item.locked);
                    this.pieces = [...locked, ...unlocked];

                    this.sound.playSnap();
                    return;
                }
            }

            // 2. Kiểm tra khớp với các mảnh hàng xóm ở bên ngoài bảng (Group Merging)
            const neighborsOffset = [
                { dr: -1, dc: 0 },
                { dr: 1, dc: 0 },
                { dr: 0, dc: -1 },
                { dr: 0, dc: 1 }
            ];

            for (const p of groupPieces) {
                for (const off of neighborsOffset) {
                    const nRow = p.row + off.dr;
                    const nCol = p.col + off.dc;
                    const neighbor = this.pieces.find(
                        item => item.row === nRow && item.col === nCol && item.groupId !== groupId
                    );

                    if (neighbor) {
                        // Vị trí chuẩn của p so với neighbor hiện tại
                        const expectedX = neighbor.x - off.dc * this.pieceSize;
                        const expectedY = neighbor.y - off.dr * this.pieceSize;
                        const dist = Math.hypot(p.x - expectedX, p.y - expectedY);

                        if (dist < snapDist) {
                            const dx = expectedX - p.x;
                            const dy = expectedY - p.y;
                            const targetGroupId = neighbor.groupId;
                            const isNeighborLocked = neighbor.locked;

                            groupPieces.forEach(gp => {
                                gp.x += dx;
                                gp.y += dy;
                                gp.groupId = targetGroupId;
                                if (isNeighborLocked) gp.locked = true;
                                this.addSnapEffect(gp.x + this.pieceSize / 2, gp.y + this.pieceSize / 2);
                            });

                            if (isNeighborLocked) {
                                const locked = this.pieces.filter(item => item.locked);
                                const unlocked = this.pieces.filter(item => !item.locked);
                                this.pieces = [...locked, ...unlocked];
                            }

                            snapped = true;
                            break;
                        }
                    }
                }
                if (snapped) break;
            }

            if (snapped) {
                this.sound.playSnap();
            }
        }

        addSnapEffect(x, y) {
            this.snapAnimations.push({
                x, y,
                radius: this.pieceSize * 0.2,
                maxRadius: this.pieceSize * 0.75,
                alpha: 0.9
            });
        }

        // Kiểm tra điều kiện chiến thắng
        checkVictory() {
            if (this.isWon) return;
            const allLocked = this.pieces.every(p => p.locked);
            if (allLocked) {
                this.isWon = true;
                clearInterval(this.timerInterval);
                this.sound.playWin();
                this.spawnConfetti();

                // Hiển thị modal chúc mừng sau 700ms để người chơi chiêm ngưỡng bức tranh hoàn chỉnh
                setTimeout(() => {
                    document.getElementById('victory-preview').src = this.sourceCanvas.toDataURL();
                    document.getElementById('victory-time').textContent = this.formatTime(this.seconds);
                    document.getElementById('victory-moves').textContent = this.moves;
                    const vModal = document.getElementById('victory-modal');
                    vModal.classList.remove('hidden');
                    vModal.classList.add('flex');
                }, 800);
            }
        }

        spawnConfetti() {
            const colors = ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
            for (let i = 0; i < 120; i++) {
                this.confetti.push({
                    x: this.canvas.width / 2,
                    y: this.canvas.height / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.7) * 18,
                    size: 6 + Math.random() * 6,
                    color: colors[i % colors.length],
                    rot: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.2
                });
            }
        }

        // Vòng lặp vẽ khung hình
        loop() {
            const ctx = this.ctx;
            const w = this.canvas.width;
            const h = this.canvas.height;
            ctx.clearRect(0, 0, w, h);

            if (this.sourceCanvas) {
                const b = this.boardRect;

                // 1. Vẽ Khung Bảng Ghép Hình (Board Frame)
                ctx.save();
                ctx.fillStyle = 'rgba(255, 250, 240, 0.85)';
                ctx.shadowColor = 'rgba(92, 64, 38, 0.14)';
                ctx.shadowBlur = 24;
                ctx.shadowOffsetY = 8;
                ctx.beginPath();
                ctx.roundRect(b.x - 10, b.y - 10, b.size + 20, b.size + 20, 16);
                ctx.fill();
                ctx.restore();

                // Nền bên trong khung
                ctx.fillStyle = '#efe5d8';
                ctx.fillRect(b.x, b.y, b.size, b.size);

                // 2. Vẽ Ảnh Mẫu Mờ (Ghost Image) nếu người chơi bật gợi ý
                if (this.showGhostHint) {
                    ctx.save();
                    ctx.globalAlpha = 0.24;
                    ctx.drawImage(this.sourceCanvas, b.x, b.y, b.size, b.size);
                    ctx.restore();
                }

                // 3. Vẽ lưới ô mờ gợi ý trên bảng
                ctx.strokeStyle = 'rgba(168, 140, 108, 0.28)';
                ctx.lineWidth = 1;
                for (let i = 1; i < this.gridSize; i++) {
                    const offset = i * this.pieceSize;
                    ctx.beginPath();
                    ctx.moveTo(b.x + offset, b.y);
                    ctx.lineTo(b.x + offset, b.y + b.size);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y + offset);
                    ctx.lineTo(b.x + b.size, b.y + offset);
                    ctx.stroke();
                }

                // Viền khung bảng
                ctx.strokeStyle = '#c8ad8d';
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x, b.y, b.size, b.size);

                // 4. Vẽ tất cả các mảnh ghép
                this.pieces.forEach(p => {
                    if (!p.cacheCanvas) return;
                    const isDragging = p.groupId === this.draggingGroup;

                    ctx.save();
                    if (isDragging) {
                        // Hiệu ứng nhấc bổng mảnh ghép khi đang kéo
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
                        ctx.shadowBlur = 16;
                        ctx.shadowOffsetX = 4;
                        ctx.shadowOffsetY = 8;
                        ctx.drawImage(p.cacheCanvas, p.x - p.pad, p.y - p.pad - 3);
                    } else if (!p.locked) {
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.18)';
                        ctx.shadowBlur = 5;
                        ctx.shadowOffsetX = 1;
                        ctx.shadowOffsetY = 2;
                        ctx.drawImage(p.cacheCanvas, p.x - p.pad, p.y - p.pad);
                    } else {
                        ctx.drawImage(p.cacheCanvas, p.x - p.pad, p.y - p.pad);
                    }
                    ctx.restore();
                });

                // 5. Hiệu ứng lóe sáng khi khớp mảnh
                for (let i = this.snapAnimations.length - 1; i >= 0; i--) {
                    const anim = this.snapAnimations[i];
                    ctx.save();
                    ctx.strokeStyle = `rgba(245, 158, 11, ${anim.alpha})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(anim.x, anim.y, anim.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();

                    anim.radius += 3.5;
                    anim.alpha -= 0.045;
                    if (anim.alpha <= 0) this.snapAnimations.splice(i, 1);
                }

                // 6. Hiệu ứng pháo giấy Confetti khi chiến thắng
                for (let i = this.confetti.length - 1; i >= 0; i--) {
                    const c = this.confetti[i];
                    c.x += c.vx;
                    c.y += c.vy;
                    c.vy += 0.35; // Trọng lực
                    c.vx *= 0.99;
                    c.rot += c.vRot;

                    ctx.save();
                    ctx.translate(c.x, c.y);
                    ctx.rotate(c.rot);
                    ctx.fillStyle = c.color;
                    ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.6);
                    ctx.restore();

                    if (c.y > h + 30) this.confetti.splice(i, 1);
                }
            }

            requestAnimationFrame(() => this.loop());
        }
    }

    // Khởi chạy game sau khi trang tải hoàn tất
    window.addEventListener('DOMContentLoaded', () => {
        window.jigsawApp = new JigsawGame();
    });
    </script>
